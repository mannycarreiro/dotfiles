# ==============================================================================
# ALACRITTY CONFIGURATION
# ==============================================================================

general.import = [
  # uncomment the flavour you want below:
  #"~/.config/alacritty/catppuccin-latte.toml"
   "~/.config/alacritty/catppuccin-frappe.toml"
  #"~/.config/alacritty/catppuccin-macchiato.toml"
  # "~/.config/alacritty/catppuccin-mocha.toml"
]

[[keyboard.bindings]]
key = "Left"
mods = "Command"
chars = "\u0001" # Sends Ctrl+A (Beginning of line)

[[keyboard.bindings]]
key = "Right"
mods = "Command"
chars = "\u0005" # Sends Ctrl+E (End of line)

# Jump word-by-word with Option + Left/Right
[[keyboard.bindings]]
key = "Left"
mods = "Alt"
chars = "\u001b[1;5D" 

[[keyboard.bindings]]
key = "Right"
mods = "Alt"
chars = "\u001b[1;5C"

# Delete whole line with Command + Backspace
[[keyboard.bindings]]
key = "Back"
mods = "Command"
chars = "\u0015" # Sends Ctrl+U


[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.95
blur = true

[window.dimensions]
columns = 150
lines = 40

[font]
size = 16.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "Off" }
